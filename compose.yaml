# Local environment: the API, PostgreSQL and a local OAuth2 server that issues test tokens.
#   Start: docker compose up --build --wait
#   Stop:  docker compose down        (add -v to remove the database as well)
name: trouble-ticket-api

services:
  app:
    build: .
    image: trouble-ticket-api:local
    depends_on:
      postgres:
        condition: service_healthy
      oauth:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trouble_ticket
      SPRING_DATASOURCE_USERNAME: trouble_ticket
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-trouble_ticket}
      # Signing keys are fetched inside the Compose network; the issuer is the address clients get tokens from.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://oauth:8080/netia/jwks
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:${OAUTH_PORT:-8090}/netia
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: trouble_ticket
      POSTGRES_USER: trouble_ticket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trouble_ticket}
    volumes:
      # PostgreSQL 18 images keep the data in /var/lib/postgresql/18/docker, so the volume is mounted one level up.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trouble_ticket -d trouble_ticket"]
      interval: 5s
      timeout: 3s
      retries: 12

  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.4
    environment:
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./docker/mock-oauth2/config.json:/config/config.json:ro
    ports:
      - "${OAUTH_PORT:-8090}:8080"

volumes:
  pgdata:
